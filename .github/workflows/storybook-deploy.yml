name: 📚 Deploy Storybook Documentation

on:
  push:
    branches:
      - storyBook

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Build Storybook
        run: npm run build-storybook

      - name: 🔧 Fix base path for GitHub Pages
        run: |
          sed -i 's|<head>|<head><base href="/ScreenPulse-frontApp/">|' storybook-static/index.html
          echo "✅ Base path configured for subdirectory deployment"

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static

      - name: ✨ Deployment successful
        run: |
          echo "✅ Storybook deployed!"
          echo "📍 URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
