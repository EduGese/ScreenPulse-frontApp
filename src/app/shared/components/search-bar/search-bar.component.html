<form id="search-form" [formGroup]="searchForm" (submit)="onSubmit()">

    <mat-form-field appearance="outline" color="accent">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" #searchFormFocus>
      <mat-hint>Mandatory</mat-hint>
      <mat-error *ngIf="searchForm.get('title')?.invalid">
        Required field
      </mat-error>
    </mat-form-field>
  
    <mat-form-field appearance="outline" color="accent">
      <mat-label>Type</mat-label>
      <mat-select formControlName="type">
        <mat-option *ngFor="let type of types" [value]="type">
          {{type | titlecase}} 
        </mat-option>
      </mat-select>
    </mat-form-field>
  
    <mat-form-field appearance="outline" color="accent">
      <mat-label>Year (optional)</mat-label>
      <input matInput formControlName="year" type="number" placeholder="1900-{{currentYear}}" >
      <mat-hint>Empty to search all years</mat-hint>
      <mat-error *ngIf="searchForm.get('year')?.invalid">
        Must be between 1900- {{currentYear}}
      </mat-error>
    </mat-form-field>
  
    
    <div class="buttons-container">
      <button mat-raised-button class="big-button" color="primary" type="submit" >
      <mat-icon>send</mat-icon>
      Find
    </button>
  
    <button mat-raised-button class="big-button" color="accent" type="button" (click)="onClear()">
      <mat-icon>clear</mat-icon>
      Clear
    </button>
    </div>

  </form>
