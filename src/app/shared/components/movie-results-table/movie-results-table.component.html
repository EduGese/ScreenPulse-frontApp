<div class="table-container">

  <table mat-table [dataSource]="dataSource" matSort layout="flexLayout" class="mat-elevation-z8">

    <ng-container matColumnDef="title">
      <th class="head" mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by title"> title
      </th>
      <td mat-cell *matCellDef="let item" class="title-cell"><span class="title-text"> {{item.title}}</span> </td>
    </ng-container>

    <ng-container matColumnDef="year">
      <th class="head" mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by year"> year
      </th>
      <td mat-cell *matCellDef="let item"><span> {{item.year}}</span> </td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th class="head" mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by type"> type
      </th>
      <td mat-cell *matCellDef="let item"><span> {{item.type}}</span> </td>
    </ng-container>

    <ng-container matColumnDef="poster">
      <th class="poster-head" mat-header-cell *matHeaderCellDef> poster </th>
      <td mat-cell *matCellDef="let item">

        <ng-container *ngIf="item.poster === 'N/A'; else poster">
          <img src="assets/images/no_poster.jpg"  alt="No poster"
          matTooltip="+ info"
          matTooltipPosition="left"
          (click)="onDetailsOpened(item)"
          (keydown.enter)="onDetailsOpened(item)"
          (keydown.space)="onDetailsOpened(item)"
          tabindex="0"
          role="button">
        </ng-container>
        <ng-template #poster>
          <img [src]="item.poster" alt="Poster"
          matTooltip="+ info"
          matTooltipPosition="left"
          (click)="onDetailsOpened(item)"
          (keydown.enter)="onDetailsOpened(item)"
          (keydown.space)="onDetailsOpened(item)"
          tabindex="0"
          role="button">
        </ng-template>
      </td>
    </ng-container>

    <ng-container matColumnDef="Add">
      <th class="head" mat-header-cell *matHeaderCellDef> </th>
      <td mat-cell *matCellDef="let item">
        <button mat-icon-button (click)="onFavoriteAdded(item)" matTooltip="Add to favorites" class="add-button">
          <mat-icon>favorite</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator [pageSize]="pageSize" [length]="collectionSize" (page)="onPageChanged($event)" showFirstLastButtons
    aria-label="Select page of results">
  </mat-paginator>
</div>
