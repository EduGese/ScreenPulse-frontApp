<div class="title" id="titleAnchor">
  <h1>
    <span class="user-name">{{ userName | uppercase }}</span> 's favorites collection
  </h1>
</div>
<ng-container *ngIf="!isLoadingFavorites; else noFavoritesLoaded" class="favorites-loaded">
  <div class="all-favorites-container">
    <app-sorting-controls [currentSort]="searchParams" (sortChange)="onSort($event)" (filterChange)="onFilter($event)"
      (mediaTypeChange)="onMediaTypeChange($event)">
    </app-sorting-controls>
    <div class="all-favorites-card">
      <ng-container *ngFor="let item of favorites; trackBy : trackByFn">
        <app-favorites-card [item]="item" (itemToDelete)="deleteFavorite($event)"
          (descriptionToDelete)="updateFavorite($event)" (descriptionToAdd)="updateFavorite($event)"
          (itemToOpen)="openFavorite($event)"></app-favorites-card>
      </ng-container>
      <ng-container *ngIf="favorites.length === 0 && !isRevalidatingAfterDelete">
        <app-empty-state></app-empty-state>
      </ng-container>
    </div>
    <div class="paginator-container">
      <mat-paginator [pageSize]="searchParams.pageSize" [pageIndex]="searchParams.currentPage - 1" [hidePageSize]="true"
        [length]="favoritesSize" (page)="onPageChanged($event)" showFirstLastButtons
        aria-label="Select page of results">
      </mat-paginator>
    </div>
  </div>
</ng-container>

<ng-template #noFavoritesLoaded>
  <app-loading-spinner></app-loading-spinner>
</ng-template>
